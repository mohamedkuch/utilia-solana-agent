name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    environment:
      name: npm
      url: https://www.npmjs.com/package/utilia-solana-agent
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.23.1
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Install npm with trusted-publishing support
        run: npm install --global npm@11.5.1
      - run: node --version && npm --version
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run test:coverage
      - run: npm run pack:check
      - run: npm run consumer:check
      - name: Build pinned production MCP image
        run: docker build --tag utilia-solana-agent:ci .
      - name: Verify MCP image initialization and six-tool discovery
        run: npm run docker:smoke
      - name: Install pinned gitleaks
        env:
          GITLEAKS_VERSION: 8.28.0
          GITLEAKS_SHA256: a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            --output "/tmp/${archive}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  /tmp/${archive}" | sha256sum --check -
          tar -xzf "/tmp/${archive}" -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
      - name: Scan Git history for secrets
        run: gitleaks detect --source . --redact --no-banner
      - name: Check whether this version is already published
        id: npm-version
        shell: bash
        run: |
          package_name="$(node -p "require('./package.json').name")"
          package_version="$(node -p "require('./package.json').version")"
          if npm view "${package_name}@${package_version}" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "${package_name}@${package_version} is already published; skipping."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish package
        if: steps.npm-version.outputs.exists != 'true'
        run: npm publish --access public
